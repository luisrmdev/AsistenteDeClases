<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Meet Audio Recorder</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
      :root {
          --color-bg: #FFFFFF;
          --color-surface: #F7F6F3;
          --color-border: #EAEAEA;
          --color-text-main: #111111;
          --color-text-muted: #787774;
          --color-pale-blue: #E1F3FE;
          --color-pale-blue-text: #1F6C9F;
          --color-pale-green: #EDF3EC;
          --color-pale-green-text: #346538;
          --color-pale-red: #FDEBEC;
          --color-pale-red-text: #9F2F2D;
          
          --btn-primary-bg: #111111;
          --btn-primary-text: #FFFFFF;
          --btn-secondary-bg: #F7F6F3;
          --btn-secondary-border: #EAEAEA;
      }

      @media (prefers-color-scheme: dark) {
          :root {
              --color-bg: #0A0A0A;
              --color-surface: #141414;
              --color-border: #2A2A2A;
              --color-text-main: #EAEAEA;
              --color-text-muted: #A1A1AA;
              --color-pale-blue: #1E3A5F;
              --color-pale-blue-text: #93C5FD;
              --color-pale-green: #14532D;
              --color-pale-green-text: #86EFAC;
              --color-pale-red: #7F1D1D;
              --color-pale-red-text: #FCA5A5;
              
              --btn-primary-bg: #EAEAEA;
              --btn-primary-text: #0A0A0A;
              --btn-secondary-bg: #141414;
              --btn-secondary-border: #2A2A2A;
          }
      }

      * { box-sizing: border-box; }
      
      body { 
          width: 320px; 
          margin: 0; 
          font-family: 'Geist', sans-serif; 
          background-color: var(--color-bg); 
          color: var(--color-text-main); 
      }

      .p-6 { padding: 1.5rem; }
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .flex-row { flex-direction: row; }
      .items-center { align-items: center; }
      .justify-between { justify-content: space-between; }
      .text-center { text-align: center; }
      .w-full { width: 100%; }
      .w-12 { width: 3rem; }
      .flex-1 { flex: 1 1 0%; }
      
      .mt-2 { margin-top: 0.5rem; }
      .mt-3 { margin-top: 0.75rem; }
      .mt-4 { margin-top: 1rem; }
      .mb-1 { margin-bottom: 0.25rem; }
      .mb-2 { margin-bottom: 0.5rem; }
      .mb-3 { margin-bottom: 0.75rem; }
      .gap-1 { gap: 0.25rem; }
      .gap-2 { gap: 0.5rem; }
      
      .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
      .py-1-5 { padding-top: 0.375rem; padding-bottom: 0.375rem; }
      .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
      .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
      .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      
      .pt-4 { padding-top: 1rem; }
      .pb-2 { padding-bottom: 0.5rem; }
      
      .rounded { border-radius: 0.25rem; }
      .rounded-md { border-radius: 0.375rem; }
      .rounded-full { border-radius: 9999px; }
      
      .border { border: 1px solid transparent; }
      .border-b { border-bottom: 1px solid transparent; }
      .border-t { border-top: 1px solid transparent; }
      
      .border-borderGray { border-color: var(--color-border); }
      .border-transparent { border-color: transparent; }
      
      .text-xs { font-size: 0.75rem; line-height: 1rem; }
      .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
      .text-\[10px\] { font-size: 10px; line-height: 1.2; }
      
      .font-bold { font-weight: 700; }
      .font-mono { font-family: 'Geist Mono', monospace; }
      
      .uppercase { text-transform: uppercase; }
      .tracking-wider { letter-spacing: 0.05em; }
      .tracking-widest { letter-spacing: 0.1em; }
      
      .text-charcoal { color: var(--color-text-main); }
      .text-textMuted { color: var(--color-text-muted); }
      .text-paleRedText { color: var(--color-pale-red-text); }
      .text-paleBlueText { color: var(--color-pale-blue-text); }
      .text-paleGreenText { color: var(--color-pale-green-text); }
      
      .bg-surface { background-color: var(--color-surface); }
      .bg-paleRed { background-color: var(--color-pale-red); }
      .bg-paleBlue { background-color: var(--color-pale-blue); }
      .bg-paleGreen { background-color: var(--color-pale-green); }
      
      .hidden { display: none !important; }
      .opacity-50 { opacity: 0.5; }
      
      input {
          border: 1px solid var(--color-border);
          background-color: var(--color-surface);
          color: var(--color-text-main);
          transition: all 0.2s;
      }
      input:focus {
          border-color: var(--color-text-main);
          outline: none;
      }
      
      button { border: none; cursor: pointer; font-family: inherit; }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      
      button.btn-primary {
          background-color: var(--btn-primary-bg);
          color: var(--btn-primary-text);
          border-radius: 6px;
          transition: transform 0.2s;
          border: 1px solid transparent;
      }
      button.btn-primary:active:not(:disabled) { transform: scale(0.98); }
      
      button.btn-secondary {
          border: 1px solid var(--btn-secondary-border);
          background-color: var(--btn-secondary-bg);
          color: var(--color-text-main);
          border-radius: 6px;
          transition: transform 0.2s;
      }
      button.btn-secondary:active:not(:disabled) { transform: scale(0.98); }

      /* Dynamic text colors */
      .status-idle { background-color: var(--color-surface); color: var(--color-text-muted); border: 1px solid var(--color-border); }
      .status-recording { background-color: var(--color-pale-red); color: var(--color-pale-red-text); border: 1px solid transparent; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .status-paused { background-color: var(--color-pale-blue); color: var(--color-pale-blue-text); border: 1px solid transparent; }
      .status-completed { background-color: var(--color-pale-green); color: var(--color-pale-green-text); border: 1px solid transparent; }
      
      @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
      }
  </style>
</head>
<body class="p-6">
  <div class="flex flex-col items-center">
    
    <!-- Title -->
    <h1 class="text-sm font-bold tracking-wider uppercase text-charcoal text-center border-b border-borderGray pb-2 w-full mb-3">
      Grabadora
    </h1>
    
    <!-- Status -->
    <div class="flex flex-col items-center w-full mb-3">
      <div id="statusIndicator" class="text-[10px] font-bold uppercase tracking-widest px-4 py-1-5 rounded-full status-idle text-center w-full">
        Listo para Iniciar
      </div>
      <div id="durationTimer" class="font-mono text-charcoal text-xs mt-3 hidden font-bold tracking-widest">00:00:00</div>
    </div>

    <!-- Label Input -->
    <div class="w-full flex flex-col gap-1 mb-3">
      <span class="text-[10px] font-bold uppercase tracking-wider text-textMuted">Etiqueta de Apuntes</span>
      <input type="text" id="customFilename" placeholder="Ej: Matematica_2" class="w-full rounded-md py-2 px-3 text-xs font-mono">
    </div>

    <!-- Record Button -->
    <button id="recordBtn" class="w-full btn-primary font-bold py-3 px-4 text-xs tracking-wider uppercase disabled:opacity-50">
      [ Iniciar Captura ]
    </button>

    <!-- Controls -->
    <div id="controlsGroup" class="flex flex-row justify-between gap-2 hidden w-full">
      <button id="pauseBtn" class="flex-1 btn-secondary font-bold py-2 px-2 text-[10px] uppercase tracking-wider hidden">
        Pausar
      </button>
      <button id="resumeBtn" class="flex-1 btn-secondary font-bold py-2 px-2 text-[10px] uppercase tracking-wider hidden">
        Reanudar
      </button>
      <button id="stopBtn" class="flex-1 btn-primary font-bold py-2 px-2 text-[10px] uppercase tracking-wider">
        Finalizar
      </button>
    </div>

    <!-- Warnings -->
    <p id="countdownDisplay" class="text-[10px] text-paleRedText bg-paleRed w-full py-1-5 rounded text-center hidden font-bold mt-2 uppercase tracking-wider">
      Apagado Auto: <span id="countdownTimer" class="font-mono">00:00</span>
    </p>

    <p id="audioWarning" class="text-[10px] text-paleRedText bg-paleRed w-full py-2 px-2 rounded text-center hidden font-bold mt-2">
      Activa el audio en la pestaña actual para comenzar.
    </p>

    <!-- Options -->
    <div class="w-full mt-4 flex flex-row items-center justify-between border-t border-borderGray pt-4">
      <span class="text-[10px] font-bold uppercase tracking-wider text-textMuted">Detención Inactiva</span>
      <div class="flex items-center gap-1">
        <input type="number" id="silenceTimeout" value="5" min="1" max="60" class="w-12 text-center rounded py-1 text-xs font-mono">
        <span class="text-[10px] text-textMuted font-bold">MIN</span>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
