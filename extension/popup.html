<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asistente de Clases</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
  <!-- Lucide Icons (Local for Manifest V3 CSP) -->
  <script src="lucide.min.js"></script>
</head>
<body>
  <div class="container">
    
    <!-- Header -->
    <div class="header-bar">
        <div class="header-title flex-row">
            <i data-lucide="mic" class="w-4 h-4"></i> Asistente de Clases
        </div>
        <button id="settingsBtn" class="icon-btn" title="Ajustes">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
    </div>
    
    <!-- ==================
         TAB LOGIN (NEW)
         ================== -->
    <div id="tab-login" class="hidden">
        <div class="text-center mb-6">
            <h2 class="text-lg font-semibold" style="color: var(--text-color);">Iniciar Sesión</h2>
            <p class="text-sm text-gray-400">Conecta la extensión a tu servidor</p>
        </div>
        
        <div class="input-group">
            <label class="input-label">URL del Servidor</label>
            <input type="text" id="loginApiUrl" placeholder="https://synq-backend.onrender.com" class="font-mono">
        </div>
        <div class="input-group mt-3">
            <label class="input-label">Usuario</label>
            <input type="text" id="loginUsername" placeholder="usuario" class="font-mono">
        </div>
        <div class="input-group mt-3">
            <label class="input-label">Contraseña</label>
            <input type="password" id="loginPassword" placeholder="••••••••" class="font-mono">
        </div>
        <div id="loginErrorMsg" class="status-badge status-danger hidden mt-3" style="text-align: center;">
            Error de credenciales
        </div>
        
        <button id="loginBtn" class="btn btn-primary mt-4" style="width: 100%;">
            Conectar
        </button>
    </div>

    <!-- ==================
         TAB AUDIO (MAIN)
         ================== -->
    <div id="tab-audio" class="hidden">
        
        <div class="status-badge status-idle" id="statusIndicator">
            Listo para Iniciar
        </div>
        
        <div id="durationTimer" class="duration font-mono hidden">00:00:00</div>

        <button id="recordBtn" class="btn btn-primary mt-4">
            <i data-lucide="play" class="w-4 h-4"></i> Iniciar Grabación
        </button>

        <div id="controlsGroup" class="flex-row hidden mt-4">
            <button id="cancelBtn" class="btn btn-secondary btn-danger">Cancelar</button>
            <button id="pauseBtn" class="btn btn-secondary hidden">Pausar</button>
            <button id="resumeBtn" class="btn btn-secondary hidden">Reanudar</button>
            <button id="stopBtn" class="btn btn-primary" style="background-color: var(--status-recording-text); color: white;">Finalizar</button>
        </div>

        <!-- Manual screenshot button — visible only while recording -->
        <div class="mt-4">
            <button id="manualScreenshotBtn" class="btn btn-screenshot hidden">
                <i data-lucide="camera" class="w-3 h-3"></i> Capturar Pantalla Ahora
            </button>
            <div id="screenshotFeedback" class="screenshot-feedback hidden">Captura guardada correctamente</div>
        </div>

        <div id="countdownDisplay" class="status-badge status-recording hidden mt-4">
            Apagado en: <span id="countdownTimer" class="font-mono" style="margin-left:4px;">00:00</span>
        </div>

        <div id="audioWarning" class="status-badge status-recording hidden mt-4">
            Activa el audio en la pestaña.
        </div>

        <div class="flex-row justify-between pt-4 mt-4 border-t">
            <label class="input-label" style="margin:0;">Detención inactiva (min)</label>
            <input type="number" id="silenceTimeout" value="5" min="1" max="60" class="font-mono" style="width: 60px;">
        </div>

        <div class="pt-4 mt-4 border-t">
            <label class="checkbox-label">
                <input type="checkbox" id="ghostModeToggle">
                Modo Fantasma (Silenciar pestaña)
            </label>
        </div>
    </div>

    <!-- ==================
         TAB SETTINGS
         ================== -->
    <div id="tab-settings" class="hidden">
        <p class="text-sm font-medium mb-4 text-center">Ajustes del Sistema</p>
        
        <div class="input-group">
            <label class="input-label">Capturas Automáticas (min)</label>
            <input type="number" id="screenshotIntervalMin" min="1" max="60" placeholder="Ej: 5" class="font-mono">
        </div>
        
        <div class="pt-4 mt-4 border-t border-borderGray">
            <label class="checkbox-label">
                <input type="checkbox" id="backupAskAlways">
                Preguntar siempre dónde guardar backup
            </label>
        </div>
        
        <div class="mt-4 pt-4 border-t border-borderGray text-center">
            <button id="closeSettingsBtn" class="btn btn-secondary w-full mb-3">Guardar y Volver</button>
            <button id="logoutBtn" class="btn btn-secondary btn-danger w-full">Cerrar Sesión</button>
        </div>
    </div>

  </div>
  
  <script src="popup.js"></script>
</body>
</html>
