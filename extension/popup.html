<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Meet Audio Recorder</title>
  <style>
    body { width: 300px; margin: 0; }
    .bg-gray-900 { background-color: #111827; }
    .text-white { color: #fff; }
    .p-6 { padding: 1.5rem; }
    .font-sans { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .space-y-4 > * + * { margin-top: 1rem; }
    .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
    .font-bold { font-weight: 700; }
    .text-blue-400 { color: #60a5fa; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .font-semibold { font-weight: 600; }
    .bg-gray-800 { background-color: #1f2937; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .rounded-full { border-radius: 9999px; }
    .text-gray-300 { color: #d1d5db; }
    .w-full { width: 100%; }
    .bg-blue-600 { background-color: #2563eb; }
    .hover\:bg-blue-500:hover { background-color: #3b82f6; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .rounded-lg { border-radius: 0.5rem; }
    .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
    .transition-colors { transition-property: background-color, border-color, color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
    .hidden { display: none !important; }
    .bg-red-600 { background-color: #dc2626; }
    .hover\:bg-red-500:hover { background-color: #ef4444; }
    
    /* Colores para los estados de popup.js */
    .text-red-400 { color: #f87171 !important; }
    .text-yellow-400 { color: #facc15 !important; }
    .text-green-400 { color: #4ade80 !important; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    
    button { border: none; cursor: pointer; }
  </style>
</head>
<body class="bg-gray-900 text-white p-6 font-sans">
  <div class="flex flex-col items-center space-y-4">
    <h1 class="text-xl font-bold text-blue-400">Audio Recorder</h1>
    
    <div id="statusIndicator" class="text-sm font-semibold bg-gray-800 px-4 py-2 rounded-full text-gray-300">
      Listo para grabar
    </div>

    <button id="recordBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-colors">
      🔴 Grabar
    </button>

    <button id="stopBtn" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-colors hidden">
      ⏹ Detener
    </button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
