<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Meet Audio Recorder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
      :root {
          --bg-main: #FFFFFF;
          --bg-surface: #F9FAFB;
          --bg-elevated: #FFFFFF;
          --border-light: #E5E7EB;
          --text-primary: #111827;
          --text-secondary: #6B7280;
          --accent: #000000;
          --accent-hover: #1F2937;
          
          --status-idle: #F3F4F6;
          --status-idle-text: #4B5563;
          --status-recording: #FEF2F2;
          --status-recording-text: #DC2626;
          --status-success: #ECFDF5;
          --status-success-text: #059669;
          
          --status-warning: #FFFBEB;
          --status-warning-text: #D97706;
          
          --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
          --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      @media (prefers-color-scheme: dark) {
          :root {
              --bg-main: #0B0B0B;
              --bg-surface: #141414;
              --bg-elevated: #1F1F1F;
              --border-light: #262626;
              --text-primary: #F3F4F6;
              --text-secondary: #9CA3AF;
              --accent: #FFFFFF;
              --accent-hover: #E5E7EB;
              
              --status-idle: #1F1F1F;
              --status-idle-text: #9CA3AF;
              --status-recording: #450A0A;
              --status-recording-text: #FCA5A5;
              --status-success: #064E3B;
              --status-success-text: #6EE7B7;
              
              --status-warning: #422006;
              --status-warning-text: #FCD34D;
          }
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      
      body { 
          width: 320px; 
          font-family: 'Geist', sans-serif; 
          background-color: var(--bg-main); 
          color: var(--text-primary); 
          -webkit-font-smoothing: antialiased;
      }

      .container { padding: 16px; }

      /* Segmented Control */
      .segmented-control {
          display: flex;
          background-color: var(--bg-surface);
          padding: 4px;
          border-radius: 8px;
          margin-bottom: 16px;
          border: 1px solid var(--border-light);
      }
      
      .segment-btn {
          flex: 1;
          text-align: center;
          padding: 6px 12px;
          font-size: 12px;
          font-weight: 500;
          color: var(--text-secondary);
          background: transparent;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          transition: all 0.2s ease;
      }
      
      .segment-btn.active {
          background-color: var(--bg-elevated);
          color: var(--text-primary);
          box-shadow: var(--shadow-sm);
          border: 1px solid var(--border-light);
      }

      /* Typography */
      .text-xs { font-size: 11px; line-height: 16px; }
      .text-sm { font-size: 13px; line-height: 20px; }
      .font-medium { font-weight: 500; }
      .font-mono { font-family: 'Geist Mono', monospace; }
      .text-muted { color: var(--text-secondary); }

      /* Inputs & Buttons */
      .input-group { margin-bottom: 16px; }
      .input-label { 
          display: block; 
          font-size: 11px; 
          font-weight: 500; 
          color: var(--text-secondary); 
          margin-bottom: 6px; 
      }
      
      input[type="text"], input[type="number"] {
          width: 100%;
          background-color: var(--bg-surface);
          border: 1px solid var(--border-light);
          color: var(--text-primary);
          border-radius: 8px;
          padding: 8px 12px;
          font-size: 13px;
          transition: border-color 0.2s;
      }
      input:focus {
          outline: none;
          border-color: var(--text-secondary);
      }

      .btn {
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          padding: 10px 16px;
          border-radius: 8px;
          font-size: 13px;
          font-weight: 500;
          cursor: pointer;
          transition: all 0.2s ease;
          border: none;
      }
      
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
      
      .btn-primary {
          background-color: var(--accent);
          color: var(--bg-main);
          box-shadow: var(--shadow-sm);
      }
      .btn-primary:hover:not(:disabled) { background-color: var(--accent-hover); }
      
      .btn-secondary {
          background-color: var(--bg-surface);
          color: var(--text-primary);
          border: 1px solid var(--border-light);
      }
      .btn-secondary:hover:not(:disabled) { background-color: var(--border-light); }

      /* Status Badges */
      .status-badge {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          padding: 4px 12px;
          border-radius: 99px;
          font-size: 11px;
          font-weight: 500;
          width: 100%;
          margin-bottom: 8px;
          transition: all 0.3s ease;
      }
      .status-idle { background-color: var(--status-idle); color: var(--status-idle-text); }
      .status-recording { 
          background-color: var(--status-recording); 
          color: var(--status-recording-text); 
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .status-success { background-color: var(--status-success); color: var(--status-success-text); }
      .status-warning { background-color: var(--status-warning); color: var(--status-warning-text); }

      /* Layout Utilities */
      .hidden { display: none !important; }
      .flex-row { display: flex; align-items: center; gap: 8px; }
      .justify-between { justify-content: space-between; }
      .mt-4 { margin-top: 16px; }
      .mb-4 { margin-bottom: 16px; }
      
      .duration {
          font-size: 24px;
          font-weight: 400;
          text-align: center;
          margin: 12px 0 20px 0;
          letter-spacing: -0.5px;
      }

      /* Preview Box */
      .preview-box {
          width: 100%;
          background-color: var(--bg-surface);
          border: 1px solid var(--border-light);
          border-radius: 8px;
          padding: 8px;
          margin: 12px 0;
      }
      .preview-img {
          width: 100%;
          border-radius: 4px;
          max-height: 140px;
          object-fit: contain;
      }

      @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.6; }
      }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- Segmented Control Tabs -->
    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <div class="segmented-control" style="flex: 1; margin-bottom: 0;">
          <button id="tab-btn-audio" class="segment-btn active">Grabar Audio</button>
          <button id="tab-btn-capture" class="segment-btn">Extraer Tarea</button>
        </div>
        <button id="settingsBtn" class="btn btn-secondary" style="width: auto; padding: 8px;" title="Ajustes">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
    </div>
    
    <!-- ==================
         TAB AUDIO 
         ================== -->
    <div id="tab-audio">
        
        <div class="status-badge status-idle" id="statusIndicator">
            Listo para Iniciar
        </div>
        
        <div id="durationTimer" class="duration font-mono hidden">00:00:00</div>

        <div class="input-group">
            <label class="input-label">Etiqueta de Apuntes</label>
            <input type="text" id="customFilename" placeholder="Ej: Clase_Fisica" class="font-mono">
        </div>

        <button id="recordBtn" class="btn btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
            Iniciar Grabación
        </button>

        <div id="controlsGroup" class="flex-row hidden">
            <button id="cancelBtn" class="btn btn-secondary" style="color: #ef4444; border-color: #ef4444;">Cancelar</button>
            <button id="pauseBtn" class="btn btn-secondary hidden">Pausar</button>
            <button id="resumeBtn" class="btn btn-secondary hidden">Reanudar</button>
            <button id="stopBtn" class="btn btn-primary" style="background: var(--status-recording-text);">Finalizar</button>
        </div>

        <div id="countdownDisplay" class="status-badge status-recording hidden mt-4">
            Apagado en: <span id="countdownTimer" class="font-mono" style="margin-left:4px;">00:00</span>
        </div>

        <div id="audioWarning" class="status-badge status-recording hidden mt-4">
            Activa el audio en la pestaña.
        </div>

        <div class="flex-row justify-between mt-4" style="border-top: 1px solid var(--border-light); padding-top: 16px;">
            <label class="input-label" style="margin:0;">Detención inactiva (min)</label>
            <input type="number" id="silenceTimeout" value="5" min="1" max="60" class="font-mono" style="width: 60px; padding: 4px 8px;">
        </div>

        <div class="flex-row justify-between mt-3" style="border-top: 1px solid var(--border-light); padding-top: 12px;">
            <label class="input-label flex-row" style="margin:0; align-items:center; gap: 8px;">
                <input type="checkbox" id="ghostModeToggle" style="cursor:pointer; width: 16px; height: 16px; margin: 0; accent-color: var(--text-main);">
                Modo Fantasma (Silenciar para mí)
            </label>
        </div>
    </div>

    <!-- ==================
         TAB CAPTURE
         ================== -->
    <div id="tab-capture" class="hidden">
        <p class="text-sm text-muted mb-4" style="text-align: center;">
            Captura la pantalla para extraer la información de la tarea usando visión multimodal.
        </p>
        
        <button id="captureTaskBtn" class="btn btn-secondary">
           <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
           Tomar Captura
        </button>
        
        <div id="previewContainer" class="hidden" style="flex-direction: column;">
           <div class="preview-box">
               <img id="capturePreviewImg" class="preview-img" src="" />
           </div>
           <button id="sendCaptureBtn" class="btn btn-primary">
              Procesar y Guardar
           </button>
        </div>
        
    <div id="captureStatus" class="status-badge status-idle hidden mt-4"></div>
    </div>

    <!-- ==================
         TAB SETTINGS
         ================== -->
    <div id="tab-settings" class="hidden">
        <p class="text-sm font-medium mb-4" style="text-align: center;">Configuración de Respaldo</p>

        <div class="input-group">
            <label class="input-label">Subcarpeta de descargas (Fallback)</label>
            <input type="text" id="backupSubfolder" placeholder="Ej: Backups_Clases/" class="font-mono">
        </div>
        
        <div class="flex-row justify-between mb-4" style="border-top: 1px solid var(--border-light); padding-top: 12px;">
            <label class="input-label flex-row" style="margin:0; align-items:center; gap: 8px;">
                <input type="checkbox" id="backupAskAlways" style="cursor:pointer; width: 16px; height: 16px; margin: 0; accent-color: var(--text-main);">
                Preguntar siempre dónde guardar el backup
            </label>
        </div>
        
        <button id="closeSettingsBtn" class="btn btn-secondary mt-4">Volver</button>
    </div>

  </div>
  
  <script src="popup.js"></script>
</body>
</html>
