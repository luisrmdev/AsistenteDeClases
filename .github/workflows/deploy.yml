name: CI/CD Pipeline para Synq

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      
    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Linting con flake8
      run: |
        pip install flake8
        # detiene el build si hay errores graves de sintaxis
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # advertencias de estilo (no detienen el build)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Trigger Webhook de Despliegue
      # Aquí configurarás el webhook que te dé tu proveedor de nube (Render, Railway, etc.)
      # curl -X POST ${{ secrets.DEPLOY_HOOK_URL }}
      run: |
        echo "Validación pasada. Listo para disparar el despliegue a la nube."
